name: Build Unsigned IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（如 0.1.0）'
        required: true
        default: '0.1.0'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240

    steps:
      - name: 检出仓库（含子模块）
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 选择 Xcode 版本
        run: |
          sudo xcode-select -s /Applications/Xcode_27.app/Contents/Developer
          xcodebuild -version

      - name: 安装 Homebrew 依赖
        run: |
          brew install meson ninja lld
          brew install node
          gem install xcodeproj

      - name: 构建 iSH-ARM64 模拟器
        run: |
          make emulator

      - name: 构建 iOS App（无签名）
        run: |
          xcodebuild archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ./build/DSH.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: 打包未签名 IPA
        run: |
          cd build/DSH.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r ../../../DSH-unsigned.ipa Payload
          cd ../../..
          mv DSH-unsigned.ipa ./

      - name: 上传 IPA 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-${{ github.event.inputs.version }}
          path: DSH-unsigned.ipa
          retention-days: 14
