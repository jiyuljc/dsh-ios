# ============================================================================
# DSH (DeepSeek Harness on iPad/iPhone) —— 在 GitHub 云端 Mac 上构建「未签名 IPA」
#
# 适用仓库：everettjf/dsh-ios 的 fork
# 工程/方案：DSH.xcodeproj / DSH
#
# 与 Harness Mobile 那套的关键差异（别把两边的工作流搞混）：
#   · 这里的 ish-arm64/deps/libapps 与 deps/libarchive 是**已 vendored 的
#     普通目录**，不是 git submodule —— 所以**不需要**拉子模块。
#   · rootfs 不是下载来的，而是在 macOS 上用**自己编出来的 iSH CLI 模拟器**
#     现场构建（Alpine + Node 22 + dsh），产物 build/root.tar.gz 约 81 MB。
#     不需要 Docker、不需要 QEMU。
#   · 工程真源是脚本生成的：scripts/gen-xcode-project.rb（make project）。
#   · 部署目标是 iOS 16.0，官方 README 要求 Xcode 27 + brew install meson ninja lld。
#   · 没有哈希审计拦截（上一套项目那个 artifacts.lock.json 问题这里不存在）。
#
# 官方 README 明确说「本项目没有托管 CI」，所以这份工作流是从
# Makefile / scripts/build-rootfs.sh / DSH.xcodeproj 反推出来的等价流程。
#
# 用法：仓库 → Actions → Build Unsigned IPA (DSH) → Run workflow
# ============================================================================

name: Build Unsigned IPA (DSH)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（只用于给产物命名，会覆盖同名 Release）'
        required: true
        default: '1.0.16'
      build_rootfs:
        description: '构建 rootfs（Alpine + Node 22 + dsh，约 81MB、需联网）。首次必须为 true'
        type: boolean
        required: true
        default: true

permissions:
  contents: write    # 发布 Release 需要

concurrency:
  group: build-dshipa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    # README 要求 Xcode 27；xcode-27 是目前唯一带 iOS 27 SDK 的托管镜像。
    runs-on: xcode-27
    timeout-minutes: 360

    env:
      DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer
      # 让 npm 在国内/受限网络下也稳一些
      npm_config_fund: 'false'
      npm_config_audit: 'false'

    steps:
      # ------------------------------------------------------------------
      # 1. 检出仓库
      #
      #    注意：不需要 submodules —— ish-arm64 的依赖已 vendored。
      # ------------------------------------------------------------------
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # ------------------------------------------------------------------
      # 2. 确认云端环境
      # ------------------------------------------------------------------
      - name: 检查云端环境
        run: |
          set -uo pipefail
          sw_vers
          uname -m
          echo "--- 可用的 Xcode ---"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          echo "--- 当前 Xcode ---"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          echo "--- 磁盘 ---"
          df -h /
          echo "--- 关键目录是否就位（vendored，不需要联网拉） ---"
          ls -d ish-arm64/deps/libapps ish-arm64/deps/libarchive ish-arm64/app || true
          ls ish-arm64/app/RootfsPatch.bundle >/dev/null 2>&1 && echo "RootfsPatch.bundle 存在" || echo "RootfsPatch.bundle 缺失"

          # 宿主主机名长度：iSH 的 kernel/uname.c 会把 uname().nodename 无界地
          # strcpy 进 guest 的 65 字节字段，宿主主机名 ≥65 字符就会在模拟器里
          # SIGTRAP（见下面第 4c 步）。这里把真实值打出来，方便事后对账。
          echo "--- 宿主主机名（iSH 会拷进 65 字节的 utsname.hostname） ---"
          HOSTN="$(hostname)"
          echo "hostname = [$HOSTN]"
          echo "length   = $(printf '%s' "$HOSTN" | wc -c | tr -d ' ')  (>=65 就会触发崩溃)"
          python3 -c 'import os;n=os.uname().nodename;print("uname().nodename = [%s] len=%d"%(n,len(n)))' 2>/dev/null || \
            echo "（拿不到 python3，跳过 uname() 复核）"

      # ------------------------------------------------------------------
      # 3. 腾磁盘
      #    最终产物包含 ~81MB 的 root.tar.gz + iSH 静态库，DERIVED_DATA 也不小。
      # ------------------------------------------------------------------
      - name: 腾出磁盘空间
        continue-on-error: true
        run: |
          df -h /
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/iOS*.simruntime || true
          sudo rm -rf ~/Library/Developer/CoreSimulator/Caches/* || true
          df -h /

      # ------------------------------------------------------------------
      # 4. 安装依赖
      #
      #    官方 README 第 83 行原话：
      #      brew install meson ninja lld
      #      (ld.lld builds the guest VDSO; without it the guest cannot run)
      #    还需要：Node.js ≥ 20 + npm（rootfs 在宿主上 npm ci）、
      #    xcodeproj gem（生成工程）、python3（hterm 编译脚本）。
      #
      #    ⚠️ libarchive 是**必须的**，虽然 README 没单独提：
      #       ish-arm64/tools/meson.build 里 fakefsify 只在
      #       `if libarchive.found()` 成立时才注册为编译目标。
      #       找不到 libarchive 时 meson 会**静默跳过**，
      #       于是 tools/fakefsify 压根不会被编出来 ——
      #       而 scripts/build-rootfs.sh 第 39 行硬要求它存在。
      #       （这是真实踩过的坑，别再从安装列表里删掉它）
      #
      #    ⚠️ 另一个坑同样适用并已规避：
      #       Homebrew 的 LLVM 从 23.x 起**不再包含 ld.lld**，
      #       必须单独装 `lld` 公式。
      # ------------------------------------------------------------------
      - name: 安装构建依赖
        run: |
          set -uo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1
          export HOMEBREW_NO_INSTALL_CLEANUP=1

          # 逐个装，互不牵连
          #   libarchive → fakefsify / unfakefsify 的依赖（见上面注释）
          #   lld        → ld.lld，guest VDSO 需要
          for pkg in meson ninja lld llvm libarchive pkg-config node python3; do
            echo "---------- brew install $pkg ----------"
            if brew list --formula "$pkg" >/dev/null 2>&1; then
              echo "已安装，跳过: $pkg"
              continue
            fi
            brew install "$pkg" 2>&1 | tail -n 15
            brew list --formula "$pkg" >/dev/null 2>&1 && echo "OK: $pkg" || echo "!! $pkg 安装失败"
          done

          echo "---------- 安装 xcodeproj gem ----------"
          # macOS runner 自带的 ruby 装 gem 需要 sudo
          sudo gem install xcodeproj --no-document 2>&1 | tail -n 10 || \
            gem install --user-install xcodeproj --no-document 2>&1 | tail -n 10 || \
            echo "!! xcodeproj 安装失败"

          echo "---------- 结果核对 ----------"
          for pkg in meson ninja lld llvm libarchive pkg-config node python3; do
            if brew list --formula "$pkg" >/dev/null 2>&1; then
              echo "  $pkg -> $(brew --prefix "$pkg")"
            else
              echo "  $pkg -> 未安装"
            fi
          done

      # ------------------------------------------------------------------
      # 4b. 让 meson 能发现 libarchive（决定 fakefsify 是否被编译）
      #
      #     ish-arm64/tools/meson.build 的查找顺序：
      #       1. dependency('libarchive')                       ← pkg-config 优先
      #       2. cc.find_library('archive', dirs: /usr/local/opt/libarchive/lib)
      #       3. cc.find_library('archive', dirs: /opt/homebrew/opt/libarchive/lib)
      #     把 PKG_CONFIG_PATH 指到 Homebrew 的 libarchive，第 1 条直接命中，最稳。
      #
      #     只把 PKG_CONFIG_PATH / LA_PREFIX 写进 $GITHUB_ENV（对后面
      #     xcodebuild 无害）；CPPFLAGS / LDFLAGS 留到第 6 步局部设置，
      #     避免 Homebrew 的 include 路径污染 iOS 目标的编译。
      # ------------------------------------------------------------------
      - name: 配置 libarchive 发现路径
        run: |
          set -uo pipefail
          LA="$(brew --prefix libarchive)"
          echo "libarchive prefix = $LA"
          # 用通配，兼容只有版本化 dylib（libarchive.13.dylib）而没有裸符号链接的情况
          ls -l "$LA/lib"/libarchive* 2>/dev/null || {
            echo "::error::libarchive 库文件不存在（$LA/lib 下找不到 libarchive*），fakefsify 不会被编译，rootfs 一定失败";
            exit 1;
          }
          ls -d "$LA/lib/pkgconfig" 2>/dev/null || echo "（无 pkgconfig 目录，meson 会走 find_library 兜底）"

          echo "PKG_CONFIG_PATH=$LA/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LA_PREFIX=$LA" >> "$GITHUB_ENV"

          pkg-config --exists libarchive && echo "pkg-config 找到 libarchive ✓ ($(pkg-config --modversion libarchive))" || \
            echo "!! pkg-config 找不到 libarchive（meson 会退回 find_library，通常也能成功）"

      # ------------------------------------------------------------------
      # 4c. 修补 ish-arm64/kernel/uname.c —— 修「模拟器一启动就 SIGTRAP」
      #
      #     第二次真跑踩到的坑（不是 libarchive 了，那个已经修好）：
      #
      #       ==> Guest phase 1: packages
      #       === HOST CRASH: signal 5 ===
      #       2   libsystem_c.dylib   __chk_fail_overflow + 24
      #       3   libsystem_c.dylib   stpcpy + 0
      #       4   ish                 sys_uname + 196
      #
      #     也就是 guest 第一次调 uname()（/bin/sh 启动时就会调）就把**宿主**
      #     的 ish 进程干掉了，signal 5 = SIGTRAP = 强化检查失败（缓冲区溢出）。
      #
      #     根因在 kernel/uname.c 的 do_uname()（上游 ish-app/ish 是同样的代码）：
      #
      #       struct utsname real_uname;
      #       uname(&real_uname);                       // ← 没有零初始化、没查返回值
      #       const char *hostname = real_uname.nodename;
      #       ...
      #       strcpy(uts->hostname, hostname);          // ← 目标只有 65 字节，无界拷贝
      #
      #     struct uname 的每个字段都是 UNAME_LENGTH=65（kernel/calls.h 第 269 行），
      #     而 host 的 nodename 是**运行环境决定**的：
      #       · 宿主主机名 ≥65 字符 → stpcpy 直接冲爆 65 字节字段；
      #       · uname() 失败/字段没被填 → real_uname 是栈上垃圾，找不到 NUL
      #         也会一直拷下去。
      #     两者都只会在特定宿主上炸（作者本地 Mac 主机名短，所以他没遇到；
      #     云端 runner 恰好会炸）。Linux 本来的语义就是「截断到 64 字符」，
      #     所以改成有界拷贝**更**符合 guest 预期，不改变正常情况下的行为。
      #
      #     注意：Xcode 工程里的 "Build Meson (iSH-ARM64)" 阶段会再编一次
      #     这份源码，所以补丁必须在这一步打，两边才一致。
      # ------------------------------------------------------------------
      - name: 修补 uname.c（宿主主机名溢出导致模拟器崩溃）
        run: |
          set -euo pipefail
          F=ish-arm64/kernel/uname.c
          test -f "$F" || { echo "::error::$F 不存在"; exit 1; }

          # 幂等：如果 fork 里已经是安全版本（hostname 走有界拷贝），别重复打
          if grep -q 'snprintf(uts->hostname' "$F"; then
            echo "uname.c 已经是安全版本（hostname 用 snprintf），跳过补丁"
            exit 0
          fi
          cp "$F" "$F.orig"

          # 用 awk（macOS 自带，不依赖 python）做三处最小改动：
          #   1. real_uname 零初始化
          #   2. uname() 失败就退回 "ish"，不用栈垃圾
          #   3. 写 guest hostname 改成 snprintf（等效——只保留前 64 个字符）
          # 匹配用前缀（不含参数），这样上游把参数改名也不会漏补。
          awk '
            index($0, "struct utsname real_uname;") > 0 {
              print $0
              print "    memset(&real_uname, 0, sizeof(real_uname));"
              print "    if (uname(&real_uname) != 0)"
              print "        strcpy(real_uname.nodename, \"ish\");"
              next
            }
            index($0, "uname(&real_uname);") > 0 { next }
            index($0, "strcpy(uts->hostname,") > 0 {
              print "    snprintf(uts->hostname, sizeof(uts->hostname), \"%s\", hostname);"
              next
            }
            { print $0 }
          ' "$F.orig" > "$F"

          echo "--- 补丁后的 do_uname ---"
          sed -n '17,36p' "$F"
          grep -q 'memset(&real_uname' "$F" || { echo "::error::补丁 1 没打上（结构体没零初始化）"; exit 1; }
          grep -q 'if (uname(&real_uname) != 0)' "$F" || { echo "::error::补丁 2 没打上（没检查 uname 返回值）"; exit 1; }
          grep -q 'snprintf(uts->hostname' "$F" || { echo "::error::补丁 3 没打上（hostname 仍是无界 strcpy）"; exit 1; }
          diff -u "$F.orig" "$F" || true
          echo "uname.c 补丁已生效 ✓"

      # ------------------------------------------------------------------
      # 5. 定位 ld.lld 并注入 PATH
      #
      #    这段逻辑是从上一套项目血泪换来的，直接复用：
      #    Homebrew 的 llvm 是 keg-only，且 23.x 起不含 ld.lld；
      #    真正的来源是独立的 `lld` 公式。
      #
      #    同时把 meson / ninja / node 的 bin 也保证在 PATH 上。
      # ------------------------------------------------------------------
      - name: 定位 ld.lld 并注入 PATH
        run: |
          set -uo pipefail

          echo "========== 定位 ld.lld =========="
          for pkg in lld llvm; do
            P="$(brew --prefix "$pkg" 2>/dev/null || true)"
            echo "brew --prefix $pkg -> '${P:-<空>}'"
            [ -n "$P" ] && [ -d "$P/bin" ] && ls "$P/bin" 2>/dev/null | grep -E 'ld\.lld|lld' || true
          done

          LLD_BIN=""
          for d in \
            "$(brew --prefix lld 2>/dev/null)/bin" \
            /opt/homebrew/opt/lld/bin \
            /opt/homebrew/bin \
            /usr/local/opt/lld/bin \
            /usr/local/bin ; do
            if [ -n "$d" ] && [ -x "$d/ld.lld" ]; then LLD_BIN="$d"; break; fi
          done

          if [ -z "$LLD_BIN" ]; then
            DEEP="$(find /opt/homebrew/Cellar /opt/homebrew/opt -name 'ld.lld' -type f 2>/dev/null | head -n 1 || true)"
            [ -n "$DEEP" ] && LLD_BIN="$(dirname "$DEEP")"
          fi

          if [ -z "$LLD_BIN" ]; then
            echo "--- 重试 brew install lld ---"
            brew install --verbose lld 2>&1 | tail -n 30 || true
            P="$(brew --prefix lld 2>/dev/null || true)"
            [ -n "$P" ] && [ -x "$P/bin/ld.lld" ] && LLD_BIN="$P/bin"
          fi

          if [ -z "$LLD_BIN" ]; then
            echo "::error::找不到 ld.lld。Makefile 的 emulator 目标会直接判失败（guest VDSO 需要它）。"
            exit 1
          fi
          echo "选定 LLD_BIN = $LLD_BIN"
          echo "$LLD_BIN" >> "$GITHUB_PATH"

          # 其他工具的 bin 也补上（keg-only 的 llvm 用于 llvm-ar 等）
          for pkg in llvm node ninja meson; do
            P="$(brew --prefix "$pkg" 2>/dev/null || true)"
            [ -n "$P" ] && [ -d "$P/bin" ] && echo "$P/bin" >> "$GITHUB_PATH"
          done

          echo "========== 确认 =========="
          export PATH="$LLD_BIN:/opt/homebrew/bin:$PATH"
          for t in ld.lld meson ninja node npm python3 ruby gem; do
            printf '  %-10s %s\n' "$t" "$(command -v "$t" 2>/dev/null || echo '缺失')"
          done
          ruby -e 'require "xcodeproj"; puts "xcodeproj gem OK (#{Xcodeproj::VERSION})"' 2>&1 | tail -n 2 || \
            echo "!! xcodeproj gem 不可用（make project 会失败）"
          xcodebuild -version

          command -v ld.lld >/dev/null || { echo "::error::ld.lld 不可用"; exit 1; }
          command -v ninja  >/dev/null || { echo "::error::ninja 不可用"; exit 1; }
          command -v meson  >/dev/null || { echo "::error::meson 不可用"; exit 1; }
          command -v npm    >/dev/null || { echo "::error::npm 不可用"; exit 1; }
          echo "工具链就绪 ✓"

      # ------------------------------------------------------------------
      # 6. 构建 iSH-ARM64 CLI 模拟器
      #
      #    等价于 `make emulator`，它会：
      #      · 先检查 ld.lld（缺了直接报 "the guest VDSO needs LLVM's linker"）
      #      · meson setup build-arm64-release -Dguest_arch=arm64 --buildtype=release
      #      · ninja -C build-arm64-release
      #
      #    产出两个后续必需的二进制：
      #      ish-arm64/build-arm64-release/ish                  ← guest 执行器
      #      ish-arm64/build-arm64-release/tools/fakefsify      ← 造 fakefs
      #    （tools/unfakefsify 是指向 fakefsify 的软链，由 meson 一并生成）
      #
      #    fakefsify 只有在 libarchive 被 meson 找到时才编译，
      #    所以这一步开始前必须先确认 libarchive 可用。
      # ------------------------------------------------------------------
      - name: 构建 iSH-ARM64 模拟器（CLI + fakefsify）
        run: |
          set -euo pipefail
          # 双保险：meson/ninja/ld.lld 必须在 PATH 上（Makefile 会自己查 ld.lld）
          export PATH="/opt/homebrew/bin:/usr/local/bin:/opt/homebrew/opt/lld/bin:$PATH"
          # 局部设置（不写进 $GITHUB_ENV），只影响这次 meson/ninja
          export LA="${LA_PREFIX:-/opt/homebrew/opt/libarchive}"
          export PKG_CONFIG_PATH="$LA/lib/pkgconfig:${PKG_CONFIG_PATH:-}"
          export CPPFLAGS="-I$LA/include"
          export LDFLAGS="-L$LA/lib"
          echo "ld.lld  -> $(command -v ld.lld || echo 缺失)"
          echo "meson   -> $(command -v meson || echo 缺失)"
          echo "ninja   -> $(command -v ninja || echo 缺失)"
          echo "libarchive -> $LA"
          command -v ld.lld >/dev/null || { echo "::error::ld.lld 缺失，make emulator 会直接失败"; exit 1; }
          pkg-config --exists libarchive && echo "pkg-config: libarchive ✓" || echo "!! pkg-config 找不到 libarchive"

          # Makefile 的逻辑是「build-arm64-release 存在就跳过 meson setup」。
          # 如果这个目录是上一次（没装 libarchive 时）留下的，配置会被缓存，
          # 重跑也不会重新探测依赖 —— 所以这里先删掉，强制干净配置。
          rm -rf ish-arm64/build-arm64-release

          make emulator

          echo "--- 产物核对 ---"
          # 用 -x 判断（和 build-rootfs.sh 自己的检查一致）：ls 成功不代表可执行
          test -x ish-arm64/build-arm64-release/ish || {
            echo "::error::ish CLI 没编出来（列一下 build 目录看看）"
            ls -la ish-arm64/build-arm64-release 2>/dev/null || true
            exit 1
          }
          test -x ish-arm64/build-arm64-release/tools/fakefsify || {
            echo "::error::tools/fakefsify 没编出来。"
            echo "::error::原因几乎一定是 meson 没找到 libarchive —— 往上看 meson setup 输出里"
            echo "::error::有没有 libarchive 的 Dependency 行，以及 'pkg-config: libarchive ✓' 那行。"
            echo "::error::（ish-arm64/tools/meson.build 只在 libarchive.found() 时才注册这个目标，找不到就静默跳过）"
            ls -la ish-arm64/build-arm64-release/tools 2>/dev/null || true
            exit 1
          }
          # unfakefsify 是 meson 的 custom_target（ln -sf fakefsify unfakefsify），
          # build-rootfs.sh 导出 root.tar.gz 时要用它，缺了同样会挂。
          test -x ish-arm64/build-arm64-release/tools/unfakefsify || {
            echo "::error::tools/unfakefsify 软链缺失，build-rootfs.sh 导出 root.tar.gz 会失败"
            exit 1
          }
          ls -la ish-arm64/build-arm64-release/ish ish-arm64/build-arm64-release/tools/

      # ------------------------------------------------------------------
      # 6b. 冒烟测试：让 guest 真的启动一次
      #
      #     `make emulator` 成功 ≠ 模拟器能跑。上次就是编译全绿，直到第 9 步
      #     rootfs 构建的 "Guest phase 1" 才崩（host SIGTRAP），前面 4 分钟的
      #     npm ci / apk 全白烧。
      #
      #     这里用最小的 Alpine minirootfs 复现 build-rootfs.sh 里那条完全相同的
      #     命令：fakefsify → `ish -f fakefs /bin/sh`。约 30 秒就能判定模拟器
      #     到底能不能用，崩了当场停在这里。
      # ------------------------------------------------------------------
      - name: 冒烟测试 iSH 模拟器（guest 启动）
        run: |
          set -euo pipefail
          BASE="$GITHUB_WORKSPACE/ish-arm64/build-arm64-release"
          # 故意用 scripts/build-rootfs.sh 的同一个缓存目录（WORK 默认
          # $ROOT/build/rootfs-work），这样 Alpine 只需下载一次，
          # 第 8 步 build-rootfs.sh 会直接复用这个 tarball。
          WORK="$GITHUB_WORKSPACE/build/rootfs-work"
          TARBALL="$WORK/alpine-minirootfs-3.21.0-aarch64.tar.gz"
          URL="https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-3.21.0-aarch64.tar.gz"
          mkdir -p "$WORK"
          if [ ! -f "$TARBALL" ]; then
            curl -fsSL --retry 3 --retry-delay 2 -o "$TARBALL.part" "$URL"
            mv "$TARBALL.part" "$TARBALL"      # 只让完整文件落位，避免半截文件被复用
          fi
          ls -lh "$TARBALL"

          cd "$WORK"
          echo "--- fakefsify ---"
          "$BASE/tools/fakefsify" "$TARBALL" fakefs

          echo "--- guest 启动测试（就是 build-rootfs.sh 的第一条 guest 命令）---"
          "$BASE/ish" -f "$WORK/fakefs" /bin/sh -c 'uname -a; echo SMOKE_OK'

          echo "模拟器冒烟通过 ✓"

      # ------------------------------------------------------------------
      # 7. 生成 DSH.xcodeproj
      #
      #    仓库里的 DSH.xcodeproj 是提交过的，但重新生成能保证与
      #    ish-arm64/iSH.xcodeproj 同步（gen-xcode-project.rb 会读它）。
      # ------------------------------------------------------------------
      - name: 生成 Xcode 工程
        run: |
          set -euo pipefail
          make project
          echo "--- 确认 scheme ---"
          ls DSH.xcodeproj/xcshareddata/xcschemes/
          xcodebuild -list -project DSH.xcodeproj

      # ------------------------------------------------------------------
      # 8. 构建 rootfs
      #
      #    等价于 `make rootfs` → scripts/build-rootfs.sh，全部在 macOS 上跑，
      #    guest 侧通过第 6 步编出来的 iSH CLI 模拟器执行（无 Docker/QEMU）：
      #      1. 下载 Alpine 3.21 minirootfs (aarch64)
      #      2. fakefsify 成 fakefs
      #      3. 宿主上 npm ci --os=linux --cpu=arm64 --libc=musl 拉 @deepseek-ai/dsh
      #      4. guest 内 apk add nodejs npm …、装 node_modules、打 overlay
      #      5. guest 内 npx node-gyp rebuild 重建 node-pty（musl）
      #      6. unfakefsify 导出 build/root.tar.gz（约 81 MB）
      #
      #    这一步要联外网（alpinelinux.org + registry.npmjs.org），
      #    正常耗时 6~20 分钟。
      # ------------------------------------------------------------------
      - name: 构建 rootfs（Alpine + Node 22 + dsh）
        if: ${{ inputs.build_rootfs }}
        run: |
          set -euo pipefail
          # node/npm 可能来自 Homebrew（/opt/homebrew/bin）或 runner 预装
          # （/usr/local/bin）。两个都放进 PATH 并显式确认。
          export PATH="/opt/homebrew/bin:/usr/local/bin:/opt/homebrew/opt/lld/bin:$PATH"
          echo "node -> $(command -v node || echo 缺失)"
          echo "npm  -> $(command -v npm  || echo 缺失)"
          node -v
          npm -v
          command -v npm >/dev/null || { echo "::error::宿主上没有 npm，build-rootfs.sh 会直接 die"; exit 1; }
          ./scripts/build-rootfs.sh
          echo "--- rootfs 产物 ---"
          ls -lh build/root.tar.gz build/root.tar.gz.sha256
          cat build/root.tar.gz.sha256
          df -h /

      # ------------------------------------------------------------------
      # 9. 兜底检查 root.tar.gz
      #
      #    如果勾了 build_rootfs=false，但仓库/缓存里也没有 root.tar.gz，
      #    xcodebuild 会在 "Copy DSH Root" 阶段报错。这里提前把话说清楚。
      # ------------------------------------------------------------------
      - name: 检查 build/root.tar.gz 是否就位
        run: |
          set -uo pipefail
          if [ -f build/root.tar.gz ]; then
            ls -lh build/root.tar.gz
            echo "rootfs 就位 ✓"
          else
            echo "::error::build/root.tar.gz 不存在。"
            echo "::error::请把 build_rootfs 输入设为 true 重新运行（它是 App 的必需资源）。"
            exit 1
          fi

      # ------------------------------------------------------------------
      # 10. 归档 App（无签名）
      #
      #    关键设置：
      #      · ARCHS=arm64 —— xcconfig 里模拟器也只编 arm64，
      #        注释原话「needs_exe_wrapper / only Apple Silicon simulators」；
      #      · CODE_SIGNING_ALLOWED=NO + CODE_SIGN_STYLE=Manual
      #        —— 云端没有你的证书；
      #      · DSH_DEVELOPMENT_TEAM= —— Makefile 默认写死作者 team
      #        YPV49M8592，必须清空；
      #      · 工程里有个 "Build Meson (iSH-ARM64)" 构建阶段会自己编
      #        libish.a / libish_emu.a / libfakefs.a，
      #        所以归档这一步耗时较长（十几到几十分钟）。
      # ------------------------------------------------------------------
      - name: 归档 App（无签名）
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project DSH.xcodeproj \
            -scheme DSH \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/DSH.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            DSH_DEVELOPMENT_TEAM="" \
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_ENTITLEMENTS="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            -skipPackagePluginValidation \
            -skipMacroValidation

      # ------------------------------------------------------------------
      # 11. 打包未签名 IPA
      # ------------------------------------------------------------------
      - name: 打包未签名 IPA
        run: |
          set -euo pipefail
          APP_DIR="$RUNNER_TEMP/DSH.xcarchive/Products/Applications"
          test -d "$APP_DIR" || { echo "::error::归档里没有 Applications 目录"; exit 1; }
          APP_PATH="$(find "$APP_DIR" -maxdepth 1 -name '*.app' | head -n 1)"
          test -n "$APP_PATH" || { echo "::error::归档里没有 .app"; exit 1; }
          echo "App: $APP_PATH"

          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "DSH-unsigned-${{ inputs.version }}.ipa" Payload
          mv "DSH-unsigned-${{ inputs.version }}.ipa" "$GITHUB_WORKSPACE/"

      # ------------------------------------------------------------------
      # 12. 校验 IPA
      # ------------------------------------------------------------------
      - name: 校验 IPA
        run: |
          set -euo pipefail
          IPA="DSH-unsigned-${{ inputs.version }}.ipa"
          unzip -l "$IPA" | head -n 15
          unzip -l "$IPA" | grep -q 'Payload/.*\.app/' || { echo "::error::IPA 结构不对"; exit 1; }

          mkdir -p "$RUNNER_TEMP/verify" && unzip -q "$IPA" -d "$RUNNER_TEMP/verify"
          APP="$(find "$RUNNER_TEMP/verify/Payload" -maxdepth 1 -name '*.app' | head -n 1)"
          BIN="$APP/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")"

          echo "--- 主二进制架构 ---"
          lipo -info "$BIN"
          lipo -info "$BIN" | grep -q arm64 || { echo "::error::主二进制不是 arm64"; exit 1; }

          echo "--- 关键内嵌资源 ---"
          ls -lh "$APP/root.tar.gz" 2>/dev/null || echo "（未找到 root.tar.gz）"
          test -f "$APP/root.tar.gz" || { echo "::error::IPA 里没有 root.tar.gz，装上去也跑不起来"; exit 1; }
          ls -lh "$APP/root.tar.gz.sha256" 2>/dev/null || true

          echo "--- 大小 ---"
          du -sh "$IPA"

      # ------------------------------------------------------------------
      # 13. 上传 IPA 为 Artifact（临时排查用）
      # ------------------------------------------------------------------
      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSH-unsigned-${{ inputs.version }}
          path: DSH-unsigned-${{ inputs.version }}.ipa
          retention-days: 14
          if-no-files-found: error

      # ------------------------------------------------------------------
      # 14. 发布 Release —— 给你「直接下载」用
      #
      #    免登录（公开仓库）、不过期、可分享链接：
      #      https://github.com/<你的用户名>/dsh-ios/releases/latest
      # ------------------------------------------------------------------
      - name: 发布 Release（IPA 直接可下载）
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ipa-${{ inputs.version }}
          name: DSH 未签名 IPA ${{ inputs.version }}
          body: |
            `everettjf/dsh-ios`（DSH — DeepSeek Harness on iPad & iPhone）的未签名 IPA。

            构建信息：
            - 版本号：`${{ inputs.version }}`
            - runner：`xcode-27`（Xcode 27.0 / iOS 27 SDK）
            - 架构：`arm64`
            - 含 rootfs：`${{ inputs.build_rootfs }}`
            - 触发提交：${{ github.sha }}
            - 构建时间：${{ github.run_started_at }}

            App 内已打包 Alpine + Node 22 + dsh 的 guest 镜像（`root.tar.gz`），
            装好后无需任何服务器或电脑。

            构建时对上游源码打了一处**最小修补**（工作流第 6 步，可自行核对）：
            `ish-arm64/kernel/uname.c` 里把宿主 `uname().nodename` 无界拷进
            65 字节字段的 `strcpy` 改成有界 `snprintf`（Linux 语义本来就是截断到
            64 字符），并给 host 的 `utsname` 做零初始化 —— 否则在部分云端/
            长主机名的机器上，guest 第一次调用 `uname()` 就会让模拟器 SIGTRAP。
            除此之外没有任何代码改动。

            安装前必须自行签名（SideStore / AltStore 等）。
            免费 Apple ID 签名有效期 7 天，到期需重新签名。要求 iOS / iPadOS 16+。

            **未签名产物；项目为 GPL-3.0，转发给他人时请一并履行源码提供义务。**
          files: DSH-unsigned-${{ inputs.version }}.ipa
          draft: false
          prerelease: true
          fail_on_unmatched_files: true

      # ------------------------------------------------------------------
      # 15. 还原被脚本改动的文件（build-rootfs.sh 会改写 package-lock.json）
      # ------------------------------------------------------------------
      - name: 还原工作区
        if: always()
        run: |
          git checkout -- rootfs/staging/package-lock.json 2>/dev/null || true
          git status --porcelain || true
          echo "--- 磁盘收尾 ---"
          df -h / || true
